<style>
  @import url('https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css');

  :root{
    --ink:#111114;
    --sub:#7a7a83;
    --sub-2:#b0b0b8;
    --line:#e9e9ec;
    --line-strong:#d7d7dc;
    --surface:#ffffff;
    --bg:#fbfbfc;
    --accent:#2f6fed;
    --accent-soft:#eef4ff;
    --warn:#a3670f;
    --warn-soft:#fdf6e8;
    --radius-lg:12px;
    --radius-md:8px;
    --radius-sm:6px;
    --mono: "SF Mono", "Roboto Mono", "Pretendard", monospace;
    --sans: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:14px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  header{
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  header .bar{
    max-width:1120px; margin:0 auto; padding:26px 32px;
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px;
  }
  header h1{
    font-size:17px; font-weight:700; margin:0; letter-spacing:-0.01em; color:var(--ink);
  }
  header .sub{ font-size:12px; color:var(--sub-2); letter-spacing:0; }

  main{ max-width:1120px; margin:0 auto; padding:36px 32px 80px; }

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:0 0 24px; margin-bottom:24px; overflow:hidden;
  }
  .panel h2{
    font-size:12.5px; font-weight:700; margin:0; color:var(--sub);
    padding:16px 22px; border-bottom:1px solid var(--line);
    text-transform:uppercase; letter-spacing:.04em;
  }
  .panel > *:not(h2){ margin-left:22px; margin-right:22px; }
  .panel h2 + *{ margin-top:22px; }

  #dropzone{
    border:1px dashed var(--line-strong); border-radius:var(--radius-md); padding:36px; text-align:center;
    cursor:pointer; transition:border-color .15s, background .15s; background:var(--bg);
  }
  #dropzone:hover, #dropzone.drag{ border-color:var(--accent); background:var(--accent-soft); }
  #dropzone .hint{ font-size:12px; color:var(--sub-2); margin-top:8px; }
  #fileInput{ display:none; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ border:1px solid var(--line); padding:9px 11px; text-align:left; }
  th{ background:var(--bg); color:var(--sub); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  tbody tr:nth-child(even) td{ background:var(--bg); }
  td.empty{ color:var(--sub-2); font-style:italic; }

  .chip{
    display:inline-block; font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:99px; background:var(--bg); border:1px solid var(--line);
    color:var(--sub); white-space:nowrap;
  }

  .grid-wrap{ overflow-x:auto; position:relative; }

  .tt-placeholder{
    padding:56px 20px; text-align:center; color:var(--sub-2); font-size:13px;
    border:1px dashed var(--line); border-radius:var(--radius-md); background:var(--bg);
  }

  table.ttgrid{ table-layout:fixed; border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; }
  table.ttgrid th, table.ttgrid td{ padding:0; text-align:center; vertical-align:middle; border-color:var(--line); }
  table.ttgrid th.ttcorner{ width:48px; background:var(--bg); color:var(--sub-2); font-size:10.5px; }
  table.ttgrid thead th{ background:var(--bg); color:var(--sub); font-size:12px; font-weight:600; padding:11px 4px; border-top:none; letter-spacing:.02em; }
  table.ttgrid th.ttperiod{ background:var(--surface); color:var(--sub-2); font-weight:600; font-size:12px; font-family:var(--mono); width:48px; padding:6px; }
  td.ttcell{ height:56px; min-width:100px; background:var(--surface); }
  td.ttempty{ color:var(--line-strong); font-size:12px; background:var(--surface); }
  .ttentry{
    height:100%; padding:6px 6px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    background:transparent; transition:background .1s, color .1s;
  }
  .ttentry + .ttentry{ border-top:1px solid var(--line); }
  .ttentry:hover{ background:var(--accent-soft); }
  .ttentry .ttsubject{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .ttentry .ttcls{ font-size:10.5px; color:var(--sub-2); }
  .ttentry.nonswap .ttsubject{ color:var(--warn); }
  .ttentry.selected{ background:var(--ink); }
  .ttentry.selected .ttsubject{ color:#fff; }
  .ttentry.selected .ttcls{ color:#9a9aa2; }

  select, button{
    font-family:var(--sans); font-size:13px; padding:8px 13px;
    border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink);
  }
  select{ cursor:pointer; }
  select:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  button{ background:var(--ink); color:#fff; cursor:pointer; font-weight:600; border-color:var(--ink); }
  button:hover{ background:#000; }
  button:disabled{ background:var(--line-strong); border-color:var(--line-strong); cursor:not-allowed; }

  .filters{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .filters label{
    font-size:11px; font-weight:600; color:var(--sub-2); text-transform:uppercase; letter-spacing:.03em;
    display:flex; flex-direction:column; gap:6px;
  }
  .filters select{ min-width:160px; }

  .result-block{ margin-top:16px; }
  .tag{
    display:inline-block; font-size:11px; font-weight:700; padding:2px 9px;
    border-radius:99px; margin-right:6px;
  }
  .tag.ok{ background:var(--bg); color:var(--ink); border:1px solid var(--line-strong); }
  .tag.warn{ background:var(--warn-soft); color:var(--warn); }

  .placeholder{
    color:var(--sub); font-size:13px; padding:16px; background:var(--bg);
    border:1px solid var(--line); border-radius:var(--radius-sm);
  }

  .summary-line{
    font-size:14px; font-weight:700; color:var(--ink); margin-bottom:16px; padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .badge-count{
    background:var(--bg); color:var(--sub); border:1px solid var(--line-strong); border-radius:99px; font-family:var(--mono);
    padding:1px 7px; font-size:10.5px; margin-left:6px; font-weight:600;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(17,17,20,.4);
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; pointer-events:none; transition:opacity .12s;
    z-index:100;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal-card{
    background:var(--surface); border-radius:var(--radius-lg); border:1px solid var(--line);
    box-shadow:0 12px 32px -8px rgba(17,17,20,.2);
    width:100%; max-width:440px; max-height:85vh; overflow-y:auto;
    padding:26px; position:relative;
    transform:translateY(6px); transition:transform .12s;
  }
  .modal-overlay.open .modal-card{ transform:translateY(0); }
  .modal-close{
    position:absolute; top:14px; right:14px; width:28px; height:28px; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:transparent; color:var(--sub-2); border:none;
    font-size:18px; line-height:1;
  }
  .modal-close:hover{ color:var(--ink); }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>대체수업 · 보강 관리</h1>
    <div class="sub" id="modeSub">엑셀 업로드 → 결강 수업 선택 → 교체/보강 후보 계산 (브라우저 내 처리, 서버 전송 없음)</div>
  </div>
</header>

<main>

  <div class="panel" id="uploadPanel">
    <h2>① 시간표 업로드 (관리자용)</h2>
    <div id="dropzone">
      <div>엑셀 파일을 여기로 드래그하거나 클릭하여 선택</div>
      <div class="hint">지원 형식: ① NEIS "학기별 전체 교사 시간표" 원본  ② 교사·요일·교시·과목·반 리스트형</div>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
    </div>
    <div id="uploadStatus" class="summary-line"></div>
    <div id="distributeArea" style="display:none; margin-top:10px;">
      <button id="distributeBtn">배포용 파일 만들기 (일반 교사용, 업로드 화면 없이 바로 사용)</button>
      <div class="hint" style="margin-top:6px;">생성된 파일을 학교 공유 경로/메신저로 배포하면, 여는 사람은 업로드 없이 바로 02번부터 사용합니다.</div>
    </div>
  </div>

  <div class="panel" id="selectPanel" style="display:none;">
    <h2>② 결강 수업 선택</h2>
    <div class="filters">
      <label>교사
        <select id="teacherFilter"></select>
      </label>
    </div>
    <div class="grid-wrap">
      <div class="tt-placeholder" id="ttPlaceholder">교사를 선택하면 시간표가 표시됩니다</div>
      <table id="scheduleTable" class="ttgrid" style="display:none;"></table>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="닫기">&times;</button>
      <div id="resultBody"></div>
    </div>
  </div>

</main>

<script>
// 배포 파일 생성을 위해 페이지 로드 시점의 원본 HTML을 캡처해둔다 (아직 어떤 조작도 가하기 전)
const ORIGINAL_HTML = document.documentElement.outerHTML;

const DAY_ORDER = ['월','화','수','목','금','토','일'];
let rows = []; // {teacher, day, period, subject, cls}
let selected = null; // {teacher, day, period, subject, cls}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const uploadStatus = document.getElementById('uploadStatus');
const selectPanel = document.getElementById('selectPanel');
const teacherFilter = document.getElementById('teacherFilter');
const scheduleTable = document.getElementById('scheduleTable');
const ttPlaceholder = document.getElementById('ttPlaceholder');
const resultBody = document.getElementById('resultBody');
const modalOverlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');
const distributeArea = document.getElementById('distributeArea');
const distributeBtn = document.getElementById('distributeBtn');
const modeSub = document.getElementById('modeSub');
const uploadPanel = document.getElementById('uploadPanel');

function openModal(){ modalOverlay.classList.add('open'); }
function closeModal(){
  modalOverlay.classList.remove('open');
  selected = null;
  renderTimetableGrid();
}
modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if(e.target===modalOverlay) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && modalOverlay.classList.contains('open')) closeModal(); });

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('drag');
  if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if(e.target.files.length) handleFile(e.target.files[0]);
});

// 자율·자치활동, 동아리활동은 시간표/교체·보강 계산에서 아예 제외
const CREATIVE_ACTIVITY = /자율|동아리/;
function removeCreativeActivities(list){
  return list.filter(r => !CREATIVE_ACTIVITY.test(String(r.subject||'')));
}

function normalizeHeader(h){
  const s = String(h).trim();
  if(/교사|이름|성명/.test(s)) return 'teacher';
  if(/요일/.test(s)) return 'day';
  if(/교시|시간/.test(s)) return 'period';
  if(/과목|교과/.test(s)) return 'subject';
  if(/반|학급/.test(s)) return 'cls';
  return s;
}

const DAY_CHARS = ['월','화','수','목','금','토','일'];

// ① 리스트형 파싱: 첫 행이 교사/요일/교시 등 헤더인 경우
function parseSimpleList(sheet){
  const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
  if(!json.length) return null;
  const headerKeys = Object.keys(json[0]).map(normalizeHeader);
  if(!headerKeys.includes('teacher') || !headerKeys.includes('day') || !headerKeys.includes('period')) return null;

  const keyMap = {};
  Object.keys(json[0]).forEach(orig => { keyMap[orig] = normalizeHeader(orig); });

  const out = json.map(r => {
    const o = {};
    Object.keys(r).forEach(k => { o[keyMap[k]] = String(r[k]).trim(); });
    o.period = String(o.period).replace(/[^0-9]/g,'');
    return o;
  }).filter(o => o.teacher && o.day && o.period);

  return out.length ? out : null;
}

// ② NEIS "학기별 전체 교사 시간표" 원본 파싱
// 구조: 헤더행(요일 라벨 + 순번/교사 성명), 다음 행(교시 번호), 이후 교사별 행
function parseNeisWide(sheet){
  const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null, raw:true});

  let headerRowIdx = -1;
  for(let i=0;i<Math.min(aoa.length,15);i++){
    const row = aoa[i] || [];
    const hasTeacherLabel = row.some(c => c && /교사/.test(String(c)));
    const hasDayLabel = row.some(c => c && DAY_CHARS.includes(String(c).trim()));
    if(hasTeacherLabel && hasDayLabel){ headerRowIdx = i; break; }
  }
  if(headerRowIdx === -1) return null;

  const headerRow = aoa[headerRowIdx];
  const periodRow = aoa[headerRowIdx+1] || [];

  // 교사 이름 열: 헤더행에서 '교사' 라벨이 있는 열
  let teacherColIdx = headerRow.findIndex(c => c && /교사/.test(String(c)));
  if(teacherColIdx === -1) return null;

  // 요일/교시 컬럼 매핑 (교사 열 다음 칸부터)
  const colMeta = {};
  let curDay = null;
  for(let i=teacherColIdx+1; i<headerRow.length; i++){
    const v = headerRow[i];
    if(v && DAY_CHARS.includes(String(v).trim())) curDay = String(v).trim();
    const p = periodRow[i];
    if(curDay && typeof p === 'number' && Number.isFinite(p)){
      colMeta[i] = {day: curDay, period: String(p)};
    }
  }
  if(!Object.keys(colMeta).length) return null;

  const out = [];
  for(let r=headerRowIdx+2; r<aoa.length; r++){
    const row = aoa[r] || [];
    const rawName = row[teacherColIdx];
    if(!rawName || !String(rawName).trim()) continue;
    const m = String(rawName).trim().match(/\(([^)]+)\)\s*$/);
    const teacher = m ? m[1] : String(rawName).trim();

    Object.keys(colMeta).forEach(colIdxStr=>{
      const colIdx = Number(colIdxStr);
      const {day, period} = colMeta[colIdx];
      const val = row[colIdx];
      if(!val || !String(val).trim()) return;
      String(val).split(',').forEach(partRaw=>{
        const part = partRaw.trim();
        if(!part) return;
        let subject, cls;
        let mm = part.match(/^(\d+)학년\s*(.+?)\((\S+)\)$/);
        if(mm){
          subject = mm[2];
          cls = `${mm[1]}-${mm[3]}`;
        }else{
          let mm2 = part.match(/^(.+?)\((\S+)\)$/);
          if(mm2){ subject = mm2[1]; cls = mm2[2]; }
          else { subject = part; cls = ''; }
        }
        out.push({teacher, day, period, subject, cls});
      });
    });
  }
  return out.length ? out : null;
}

function handleFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];

      let parsed = parseSimpleList(sheet);
      let formatLabel = '리스트형';
      if(!parsed){
        parsed = parseNeisWide(sheet);
        formatLabel = 'NEIS 전체 교사 시간표';
      }
      if(!parsed) throw new Error('no valid rows');

      rows = removeCreativeActivities(parsed);
      uploadStatus.innerHTML = `불러오기 완료 (${formatLabel}) · 총 ${rows.length}건 · 교사 ${new Set(rows.map(r=>r.teacher)).size}명 <span class="tag ok">OK</span>`;
      distributeArea.style.display = 'block';
      buildSelectPanel();
      selected = null;
      modalOverlay.classList.remove('open');
    }catch(err){
      uploadStatus.innerHTML = `<span class="tag warn">읽기 실패</span> 지원되는 두 형식 중 하나인지 확인해주세요`;
    }
  };
  reader.readAsArrayBuffer(file);
}

function buildSelectPanel(){
  selectPanel.style.display = 'block';

  const teachers = [...new Set(rows.map(r=>r.teacher))].sort();

  teacherFilter.innerHTML = `<option value="">교사 선택</option>` + teachers.map(t=>`<option value="${t}">${t}</option>`).join('');
  teacherFilter.value = '';
  teacherFilter.onchange = () => {
    selected = null;
    modalOverlay.classList.remove('open');
    renderTimetableGrid();
  };

  renderTimetableGrid();
}

// 요일×교시 격자로 선택된 교사의 시간표를 실제 시간표처럼 렌더링
function renderTimetableGrid(){
  const teacher = teacherFilter.value;

  if(!teacher){
    scheduleTable.style.display = 'none';
    ttPlaceholder.style.display = 'block';
    return;
  }
  ttPlaceholder.style.display = 'none';
  scheduleTable.style.display = '';

  const list = rows.filter(r => r.teacher===teacher);

  const days = [...new Set(rows.map(r=>r.day))].sort((a,b)=>DAY_ORDER.indexOf(a)-DAY_ORDER.indexOf(b));
  const maxPeriod = Math.max(1, ...rows.map(r=>Number(r.period)||0));
  const periods = Array.from({length:maxPeriod}, (_,i)=>String(i+1));

  // (day, period) -> 해당 교사의 수업 목록 (동시간대 중복 데이터 대비 배열)
  const byCell = {};
  list.forEach(r=>{
    const key = r.day+'_'+r.period;
    (byCell[key] = byCell[key] || []).push(r);
  });

  let html = `<thead><tr><th class="ttcorner">교시</th>${days.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>`;
  periods.forEach(p=>{
    html += `<tr><th class="ttperiod">${p}</th>`;
    days.forEach(d=>{
      const entries = byCell[d+'_'+p] || [];
      if(!entries.length){
        html += `<td class="ttcell ttempty">–</td>`;
      }else{
        html += `<td class="ttcell">` + entries.map(r=>{
          const isSel = selected && selected.teacher===r.teacher && selected.day===r.day && selected.period===r.period && selected.cls===r.cls;
          const nonSwap = isNonSwappable(r.subject);
          return `<div class="ttentry${isSel?' selected':''}${nonSwap?' nonswap':''}" data-idx="${rows.indexOf(r)}">
            <div class="ttsubject">${r.subject||'(과목 미상)'}</div>
            <div class="ttcls">${r.cls||''}</div>
          </div>`;
        }).join('') + `</td>`;
      }
    });
    html += `</tr>`;
  });
  html += `</tbody>`;
  scheduleTable.innerHTML = html;

  scheduleTable.querySelectorAll('.ttentry').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = Number(el.dataset.idx);
      selected = rows[idx];
      renderTimetableGrid();
      computeAndRender();
    });
  });
}

function isFree(teacher, day, period){
  return !rows.some(r => r.teacher===teacher && r.day===day && r.period===period);
}

// 동아리활동/자율활동/주제선택활동 등 창체 계열은 교체 불가 - 무조건 보강 처리
const NON_SWAPPABLE_SUBJECT = /자율|자치|동아리|진로활동|주제선택|스포츠클럽|창의적체험/;
function isNonSwappable(subject){
  return NON_SWAPPABLE_SUBJECT.test(String(subject||''));
}

function computeAndRender(){
  if(!selected) return;
  const {teacher:T, day:D, period:P, subject:Sub, cls:C} = selected;
  const blockedByType = isNonSwappable(Sub);

  // 교체 후보: 같은 반(C)의 다른 시간 수업(T2,D2,P2,subject2) 중
  //   해당 수업이 창체 계열이 아니고, T2가 (D,P)에 공강이고, T가 (D2,P2)에 공강인 경우
  const swapCandidates = [];
  if(C && !blockedByType){
    rows.forEach(r=>{
      if(r.cls===C && !(r.day===D && r.period===P) && r.teacher!==T && !isNonSwappable(r.subject)){
        const t2FreeAtOrig = isFree(r.teacher, D, P);
        const tFreeAtOther = isFree(T, r.day, r.period);
        if(t2FreeAtOrig && tFreeAtOther){
          swapCandidates.push(r);
        }
      }
    });
  }

  // 보강 후보: (D,P)에 공강인 전체 교사
  const allTeachers = [...new Set(rows.map(r=>r.teacher))];
  const subCandidates = allTeachers.filter(t => t!==T && isFree(t, D, P));

  let html = `<div class="summary-line">${T} · <span class="chip">${D}</span> <span class="chip">${P}교시</span> · ${Sub||'(과목 미상)'} · ${C||'(반 미상)'}반</div>`;

  html += `<div class="result-block"><span class="tag ok">교체 후보</span><span class="badge-count">${swapCandidates.length}</span>`;
  if(blockedByType){
    html += `<div class="placeholder">창체 계열은 교체 대상이 아닙니다. 보강으로 처리하세요.</div>`;
  }else if(swapCandidates.length){
    html += `<table style="margin-top:8px;"><thead><tr><th>대상 교사</th><th>원래 요일/교시</th><th>과목</th></tr></thead><tbody>`;
    swapCandidates.forEach(r=>{
      html += `<tr><td>${r.teacher}</td><td><span class="chip">${r.day}</span> <span class="chip">${r.period}교시</span></td><td>${r.subject||''}</td></tr>`;
    });
    html += `</tbody></table>`;
  }else{
    html += `<div class="placeholder">조건을 만족하는 교체 대상이 없습니다.</div>`;
  }
  html += `</div>`;

  html += `<div class="result-block" style="margin-top:16px;"><span class="tag warn">보강 후보</span><span class="badge-count">${subCandidates.length}</span>`;
  if(subCandidates.length){
    html += `<table style="margin-top:8px;"><thead><tr><th>교사</th></tr></thead><tbody>`;
    subCandidates.forEach(t=>{
      html += `<tr><td>${t}</td></tr>`;
    });
    html += `</tbody></table>`;
  }else{
    html += `<div class="placeholder">${D} ${P}교시에 공강인 교사가 없습니다.</div>`;
  }
  html += `</div>`;

  resultBody.innerHTML = html;
  openModal();
}

// 관리자: 현재 파싱된 시간표 데이터를 내장한 배포용 HTML 파일 생성
distributeBtn.addEventListener('click', () => {
  const dataJson = JSON.stringify(rows).replace(/</g, '\\u003c'); // 스크립트 종료 태그 오인 방지
  const output = ORIGINAL_HTML.replace(
    '<script id="embedded-data" type="application/json">null<\/script>',
    `<script id="embedded-data" type="application/json">${dataJson}<\/script>`
  );
  const blob = new Blob([output], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '대체수업_보강_관리_배포용.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

// 페이지 로드 시: 관리자가 배포한 데이터가 내장되어 있으면 업로드 없이 바로 사용 모드로 전환
(function initFromEmbeddedData(){
  const el = document.getElementById('embedded-data');
  if(!el) return;
  let parsed = null;
  try{ parsed = JSON.parse(el.textContent); }catch(e){ parsed = null; }
  if(Array.isArray(parsed) && parsed.length){
    rows = removeCreativeActivities(parsed);
    uploadPanel.style.display = 'none';
    modeSub.textContent = `배포된 시간표 데이터 사용 중 · 총 ${rows.length}건 · 교사 ${new Set(rows.map(r=>r.teacher)).size}명`;
    buildSelectPanel();
  }
})();
</script></body></html>
